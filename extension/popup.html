<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CodeShelf</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #6b7280;
        --line: #e5e7eb;
        --card: #f6f8fa;
        --accent: #2563eb;
        --ok: #059669;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --fg: #eaeaea;
          --muted: #9ca3af;
          --line: #2f2f2f;
          --card: #262626;
          --accent: #60a5fa;
          --ok: #34d399;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        width: 420px;
        max-height: 580px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--line);
        z-index: 1;
      }
      .top { display: flex; align-items: center; gap: 8px; }
      .top h1 { font-size: 15px; margin: 0; }
      .count { color: var(--muted); }
      .top button { margin-left: auto; }
      input[type="search"] {
        width: 100%;
        margin-top: 8px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
      }
      button {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        border-radius: 6px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      ul { list-style: none; margin: 0; padding: 6px 8px 10px; }
      li { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: var(--card); }
      summary { cursor: pointer; padding: 8px 10px; list-style: none; }
      summary::-webkit-details-marker { display: none; }
      .title { font-weight: 600; }
      .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .lang { color: var(--ok); font-weight: 600; }
      .body { padding: 0 10px 10px; }
      pre {
        margin: 0 0 8px;
        padding: 8px;
        max-height: 260px;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre;
      }
      .actions { display: flex; gap: 6px; align-items: center; }
      .actions a { color: var(--accent); margin-left: auto; text-decoration: none; }
      .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
      #cloud { padding: 10px 14px; border-bottom: 1px solid var(--line); }
      .cloud-row { display: flex; align-items: center; gap: 6px; }
      .cloud-row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.on { background: var(--ok); }
      form { display: grid; gap: 6px; margin-top: 8px; }
      form input {
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
      }
      form button { justify-self: start; }
      .hint { color: var(--muted); font-size: 12px; margin: 0; }
      .error { color: #dc2626; font-size: 12px; margin: 6px 0 0; }
      .notice { color: var(--ok); }
      .google { display: inline-flex; align-items: center; justify-content: center; gap: 8px; justify-self: stretch; padding: 7px 10px; font-weight: 600; }
      .or { text-align: center; }
      #cloud-account { margin-top: 6px; }
      #cloud-account a { color: var(--muted); }
      .badge { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); margin-left: 6px; }
      .badge.synced { color: var(--ok); border-color: var(--ok); }
    </style>
  </head>
  <body>
    <header>
      <div class="top">
        <h1>CodeShelf</h1>
        <span class="count" id="count"></span>
        <button id="export" type="button">Export JSON</button>
      </div>
      <input id="search" type="search" placeholder="Filter by problem or language" autocomplete="off" />
    </header>
    <section id="cloud">
      <div class="cloud-row">
        <span class="dot" id="cloud-dot"></span>
        <span class="label" id="cloud-label">Not signed in · solutions are saved on this browser only</span>
        <button id="cloud-sync" type="button" hidden>Sync now</button>
        <button id="cloud-toggle" type="button">Sign in</button>
      </div>
      <form id="cloud-form" hidden>
        <button type="button" id="google" class="google">
          <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 2.9-2.2 5.4-4.7 7.1l7.3 5.7c4.3-4 6.7-9.9 6.7-17.3z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2.2 1.5-5 2.3-8.6 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
          Continue with Google
        </button>
        <p class="hint or">or use email</p>
        <input name="email" type="email" placeholder="Email" required autocomplete="username" />
        <input name="password" type="password" placeholder="Password (8+ characters)" required minlength="8" autocomplete="current-password" />
        <div class="cloud-row">
          <button type="submit" value="AUTH_SIGN_IN">Sign in</button>
          <button type="submit" value="AUTH_SIGN_UP">Create account</button>
        </div>
        <p class="hint">Back up your solutions and see them on any device. Your password is only used to sign in; it isn't stored.</p>
      </form>
      <p class="hint" id="cloud-account" hidden>
        <a href="#" id="cloud-delete">Delete my cloud data</a>
      </p>
      <p class="error" id="cloud-error" hidden></p>
    </section>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>No saved solutions yet. Submit an Accepted solution on LeetCode.</p>
    <script src="popup.js"></script>
  </body>
</html>
